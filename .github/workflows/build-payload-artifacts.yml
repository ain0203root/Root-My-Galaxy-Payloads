name: Build S24 FE Payload Artifact

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
      - 'support/targets-v3.json'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payload-artifact-s721b
  cancel-in-progress: false

env:
  TARGET: r12s-S721BXXSCDZF3
  ARTIFACT_PATH: artifacts/r12s-S721BXXSCDZF3/cve-2026-43499-app.so

jobs:
  build:
    name: Rebuild S24 FE artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and normalize exact util.c recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          path = Path('src/util.c')
          current = path.read_text()
          corrupt = subprocess.check_output(
              ['git', 'show', '27d2e08ccb0ac248e282b01a291a93c607c8d61f:src/util.c'],
              text=True,
          )
          base = subprocess.check_output(
              ['git', 'show', '143759e3300690a09e863be0b953e122bb42285d:src/util.c'],
              text=True,
          )
          clone_start = base.index('int clone_memfd(void) {')
          clone_end = base.index('\n}', clone_start) + 2
          base_clone = base[clone_start:clone_end]
          corrupt_clone_end = corrupt.index('\n}', corrupt.index('int clone_memfd(void) {')) + 2
          if corrupt[:corrupt_clone_end] != current[:corrupt_clone_end]:
              raise SystemExit('current prefix through clone_memfd() was modified')
          if current[:clone_end] != corrupt[:corrupt_clone_end]:
              raise SystemExit('current util.c prefix through clone_memfd() differs from the pre-recovery file')

          new_text = current[:clone_end] + base[clone_end:]
          prefix_diff = ''.join(difflib.unified_diff(
              current[:clone_end].splitlines(True),
              new_text[:clone_end].splitlines(True),
              fromfile='before-prefix', tofile='after-prefix'))
          if prefix_diff:
              print(prefix_diff, end='')
              raise SystemExit('prefix diff is not empty')

          path.write_text(new_text)
          if new_text.endswith('/* rest of util.c unchanged */'):
              raise SystemExit('recovery marker still present')
          for symbol in ('prepare_good_kernel_page', 'prepare_kernel_page', 'configfs_write_once', 'configfs_read_once', 'kernel_read64', 'kernel_write_data', 'kernel_read_data'):
              if symbol not in new_text:
                  raise SystemExit(f'missing recovered symbol: {symbol}')

          print('=== EXACT PREFIX DIFF (must be empty) ===')
          print('=== INSERTION BOUNDARY ===')
          print(f'preserved through clone_memfd() closing brace at base byte offset {clone_end}')
          print(f'inserted_lines_after_brace={len(new_text[clone_end:].splitlines())}')
          print('=== SYMBOL CHECK ===')
          for symbol in ('prepare_good_kernel_page', 'prepare_kernel_page', 'configfs_write_once', 'configfs_read_once', 'kernel_read64', 'kernel_write_data', 'kernel_read_data'):
              print(symbol)
          PY
          git diff --check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'
          accept-android-sdk-licenses: true

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Resolve NDK path
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Build only S24 FE target
        shell: bash
        run: |
          set -euo pipefail
          test -f "src/targets/${TARGET}/target.h"
          make clean TARGET="${TARGET}"
          make all release TARGET="${TARGET}"
          output="build/${TARGET}/cve-2026-43499-app.release.so"
          test -f "$output"
          size="$(stat -c %s "$output")"
          echo "Built $output ($size bytes)"
          test "$size" -eq 104128

      - name: Commit exact util.c recovery and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout 83afa07820173a2756256c942e48cb78526b7bc7 -- .github/workflows/build-payload-artifacts.yml
          git add src/util.c .github/workflows/build-payload-artifacts.yml
          git diff --cached --check
          git commit -m "fix: preserve exact util.c recovery boundary [skip ci]"
          git push origin HEAD:main