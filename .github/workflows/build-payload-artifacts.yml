name: Build S24 FE Payload Artifact

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
      - 'support/targets-v3.json'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: r12s-S721BXXSCDZF3
  ARTIFACT_PATH: artifacts/r12s-S721BXXSCDZF3/cve-2026-43499-app.so

jobs:
  build:
    name: Rebuild S24 FE artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore tail exactly at clone_memfd boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/util.c')
          current = path.read_text()
          base = subprocess.check_output(['git', 'show', '143759e3300690a09e863be0b953e122bb42285d:src/util.c'], text=True)

          def clone_end(text):
              start = text.index('int clone_memfd(void) {')
              return text.index('\n}', start) + 2

          ce = clone_end(current)
          be = clone_end(base)
          prefix = current[:ce]
          new_text = prefix + base[be:]
          if new_text[:ce] != prefix:
              raise SystemExit('bytes through clone_memfd() closing brace changed')
          path.write_text(new_text)
          if '/* rest of util.c unchanged */' in new_text:
              raise SystemExit('stub remains')
          required = ('prepare_good_kernel_page', 'prepare_kernel_page', 'configfs_write_once', 'configfs_read_once', 'kernel_read64', 'kernel_write_data', 'kernel_read_data')
          missing = [s for s in required if s not in new_text]
          if missing:
              raise SystemExit('missing recovered symbols: ' + ', '.join(missing))
          print(f'preserved_prefix_bytes={ce}')
          print(f'restored_tail_lines={len(base[be:].splitlines())}')
          print('prefix_diff=EMPTY')
          print('stub_absent=YES')
          for s in required:
              print(f'symbol:{s}=PRESENT')
          PY
          git diff --check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'
          accept-android-sdk-licenses: true

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Resolve NDK path
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Build only S24 FE target
        shell: bash
        run: |
          set -euo pipefail
          make clean TARGET="${TARGET}"
          make all release TARGET="${TARGET}"
          output="build/${TARGET}/cve-2026-43499-app.release.so"
          test -f "$output"
          size="$(stat -c %s "$output")"
          echo "Built $output ($size bytes)"
          test "$size" -eq 104128

      - name: Commit util.c only and restore original workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout 83afa07820173a2756256c942e48cb78526b7bc7 -- .github/workflows/build-payload-artifacts.yml
          git add src/util.c .github/workflows/build-payload-artifacts.yml
          git diff --cached --check
          git commit -m "fix: preserve exact util.c tail boundary [skip ci]"
          git push origin HEAD:main