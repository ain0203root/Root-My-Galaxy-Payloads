name: Build S24 FE Payload Artifact

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
      - 'support/targets-v3.json'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payload-artifact-s721b
  cancel-in-progress: false

env:
  TARGET: r12s-S721BXXSCDZF3
  ARTIFACT_PATH: artifacts/r12s-S721BXXSCDZF3/cve-2026-43499-app.so

jobs:
  build:
    name: Rebuild S24 FE artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover util.c tail only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          path = Path('src/util.c')
          current = path.read_text()
          marker = '/* rest of util.c unchanged */'
          if current.count(marker) != 1:
              raise SystemExit('util.c recovery marker missing or duplicated')

          prefix, _ = current.split(marker, 1)
          prefix = prefix.rstrip() + '\n'
          base = subprocess.check_output(
              ['git', 'show', '143759e3300690a09e863be0b953e122bb42285d:src/util.c'],
              text=True,
          )
          clone_start = base.index('int clone_memfd(void) {')
          clone_end = base.index('\n}', clone_start) + 2
          base_clone = base[clone_start:clone_end]
          if not prefix.rstrip().endswith(base_clone):
              raise SystemExit('current util.c does not end at the expected clone_memfd() boundary')

          new_text = prefix + base[clone_end:]
          path.write_text(new_text)

          before_marker = current[:current.index(marker)]
          before_new = new_text[:new_text.index(base[clone_end:])]
          if before_new != prefix:
              raise SystemExit('prefix preservation assertion failed')

          removed = list(difflib.unified_diff(
              before_marker.splitlines(True),
              before_new.splitlines(True),
              fromfile='current-prefix',
              tofile='recovered-prefix',
          ))
          print('=== PREFIX DIFF (must be empty) ===')
          print(''.join(removed), end='')
          print('=== RECOVERY BOUNDARY ===')
          print(f'clone_memfd() ends at base offset {clone_end} bytes')
          print(f'restored_tail_lines={len(new_text.splitlines()) - len(prefix.splitlines())}')
          print('=== TAIL SYMBOL CHECK ===')
          for symbol in ('prepare_good_kernel_page', 'prepare_kernel_page', 'configfs_write_once', 'configfs_read_once', 'kernel_read64', 'kernel_write_data', 'kernel_read_data'):
              if symbol not in new_text:
                  raise SystemExit(f'missing recovered symbol: {symbol}')
              print(symbol)
          PY
          test "$(tail -n 1 src/util.c)" != '/* rest of util.c unchanged */'
          git diff --check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'
          accept-android-sdk-licenses: true

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Resolve NDK path
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using ANDROID_NDK_HOME=$NDK_HOME"

      - name: Build only S24 FE target
        shell: bash
        run: |
          set -euo pipefail
          test -f "src/targets/${TARGET}/target.h"
          echo "=== BUILD ${TARGET} ONLY ==="
          make clean TARGET="${TARGET}"
          make all release TARGET="${TARGET}"

          output="build/${TARGET}/cve-2026-43499-app.release.so"
          test -f "$output"
          size="$(stat -c %s "$output")"
          echo "Built $output ($size bytes)"

          mkdir -p "$(dirname "${ARTIFACT_PATH}")" diagnostics
          install -m 0644 "$output" "${ARTIFACT_PATH}"
          sha256sum "${ARTIFACT_PATH}" | tee diagnostics/s721b-app.sha256

      - name: Verify S24 FE artifact only
        shell: bash
        run: |
          set -euo pipefail
          test -f "${ARTIFACT_PATH}"
          actual="$(stat -c %s "${ARTIFACT_PATH}")"
          test "$actual" -eq 104128

          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          target = "r12s-S721BXXSCDZF3"
          manifest = json.loads(Path('support/targets-v3.json').read_text())
          candidates = [p for p in manifest.get('payloads', []) if p.get('payloadId') == target]
          if not candidates:
              raise SystemExit(f"S24 FE profile not found in manifest: {target}")

          p = candidates[0]
          url = p['exploit']['url']
          path = urlparse(url).path
          expected_suffix = f"/artifacts/{target}/cve-2026-43499-app.so"
          if not path.endswith(expected_suffix):
              raise SystemExit(f"S24 FE exploit URL does not point to {expected_suffix}: {url}")

          expected = int(p['exploit']['size'])
          actual = Path('artifacts') / target / 'cve-2026-43499-app.so'
          if actual.stat().st_size != expected:
              raise SystemExit(f"S24 FE artifact size mismatch: {actual.stat().st_size} != {expected}")

          print(f"verified S24 FE target {target}: {actual.stat().st_size} bytes")
          PY

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: s721b-payload-build-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Commit recovered util.c and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/build-payload-artifacts.yml
          git add src/util.c .github/workflows/build-payload-artifacts.yml
          if git diff --cached --quiet; then
            echo "No util.c recovery changes."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: restore util.c tail only [skip ci]"
          git push origin HEAD:main